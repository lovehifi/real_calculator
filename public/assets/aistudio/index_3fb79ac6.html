<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Real Calculator Pro</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/real-calculator.css">
<link rel="stylesheet" href="assets/macos-theme.css">
<style>
  /* === INLINE OVERRIDES — macOS Desktop App Shell === */

  /* Nền desktop bên ngoài cửa sổ */
  html { background: #2d2d31 !important; }
  body { background: #2d2d31 !important; margin: 0 !important; padding: 0 !important; }

  /* Ẩn triệt để mọi thứ web: breadcrumb, page-head, kpi sticky bar gốc, pro_logout */
  .page-head, .page-head--app, .crumb, .kpis,
  [data-act="pro_logout"], .fs-acts,
  .local-header { display: none !important; }

  /* Thanh KPI sticky gốc (class kpis) — ẩn hẳn vì ta dùng mac-kpi-bar riêng */

  /* Fix layout: bỏ grid sidebar, full width */
  #fs-app .fs-hold {
    display: block !important;
    padding: 0 !important;
  }
  #fs-app .fs-body {
    max-width: 100% !important;
    padding: 0 !important;
  }

  /* macOS Unified Toolbar overrides bổ sung */
  .mac-titlebar {
    -webkit-app-region: drag; /* Cho phép kéo cửa sổ khi đóng gói Tauri/Electron */
  }
  .mac-titlebar button,
  .mac-titlebar input,
  .mac-titlebar a {
    -webkit-app-region: no-drag;
  }
</style>
<script>
  window.RC_PRO = true;
  window.FS_PRO = true;
  document.documentElement.className += ' js';
</script>
</head>
<body>

<!-- ============================================================
     macOS WINDOW SHELL
     ============================================================ -->
<div class="mac-app-wrapper" id="mac-window">

  <!-- macOS Unified Titlebar / Toolbar -->
  <div class="mac-titlebar">
    <!-- Traffic Lights -->
    <div class="mac-traffic-lights">
      <span class="mac-traffic-dot close" title="Đóng"></span>
      <span class="mac-traffic-dot minimize" title="Thu nhỏ"></span>
      <span class="mac-traffic-dot zoom" title="Phóng to"></span>
    </div>

    <!-- Document Title -->
    <div class="mac-document-title">
      <span class="app-icon">📊</span>
      <span>Real Calculator Pro</span>
      <span class="mac-document-badge">40 Quý</span>
    </div>

    <!-- Toolbar Actions -->
    <div class="mac-toolbar-actions">
      <div class="mac-segmented" id="mac-view-switch">
        <button class="mac-segmented-item active" onclick="switchViewMode('y')">Năm</button>
        <button class="mac-segmented-item" onclick="switchViewMode('q')">Quý</button>
      </div>
      <button class="mac-btn" onclick="switchLang()">
        <span id="mac-lang-label">VI</span>
      </button>
      <button class="mac-btn" onclick="resetSampleData()">↺ Reset</button>
    </div>
  </div>

  <!-- macOS Main Content Area -->
  <div class="mac-workspace">
    <!-- App Container — JS sẽ render vào đây -->
    <div class="app" id="real-calc-app" style="background:transparent;">
      <div class="wrap fs-hold">
        <p style="color:#6e6e73; font-weight:500; padding:32px 0; text-align:center; font-size:14px;">
          ⏳ Đang khởi tạo Real Calculator...
        </p>
      </div>
    </div>
  </div>

</div>
<!-- End macOS WINDOW SHELL -->

<!-- JS Scripts -->
<script src="assets/site.js"></script>
<script src="assets/real-labels.js"></script>
<script src="assets/real-sample.js"></script>
<script src="assets/real-app.js"></script>
<script src="assets/real-calc.js"></script>

<script>
  /* === macOS Desktop App UI Logic === */

  function switchViewMode(mode) {
    try {
      sessionStorage.setItem("fslab.fspro.cfm", mode);
      // Update segmented control UI
      document.querySelectorAll('#mac-view-switch .mac-segmented-item').forEach(function(btn) {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
      location.reload();
    } catch(e) { location.reload(); }
  }

  function switchLang() {
    try {
      var cur = localStorage.getItem("fslab.lang") || "vi";
      var next = cur === "vi" ? "en" : "vi";
      localStorage.setItem("fslab.lang", next);
      document.getElementById("mac-lang-label").textContent = next.toUpperCase();
      location.reload();
    } catch(e) { location.reload(); }
  }

  function resetSampleData() {
    if (confirm("Khôi phục toàn bộ dữ liệu mẫu gốc?")) {
      try {
        ["fslab.fspro.v1","fslab.fs.v2","realcalc.pro.v1","realcalc.main.v2"].forEach(function(k){
          sessionStorage.removeItem(k);
          localStorage.removeItem(k);
        });
      } catch(e) {}
      location.reload();
    }
  }

  // Đồng bộ trạng thái segmented control với session hiện tại
  (function() {
    try {
      var mode = sessionStorage.getItem("fslab.fspro.cfm") || "y";
      var items = document.querySelectorAll('#mac-view-switch .mac-segmented-item');
      items.forEach(function(btn) { btn.classList.remove('active'); });
      if (mode === "q" && items.length > 1) items[1].classList.add('active');
      else if (items.length > 0) items[0].classList.add('active');
    } catch(e) {}
  })();

  // macOS Cleanup: Ẩn mọi phần web dư thừa sau khi JS render
  function macCleanup() {
    // Ẩn "Bảng tính X/5..." bar và action buttons
    document.querySelectorAll('.fs-bar, .fs-sheet-bar, .fs-sheet-barr').forEach(function(el) {
      el.style.display = 'none';
    });
    // Ẩn tất cả button data-act (pro_logout, pro_sample, pro_clear, lang)
    document.querySelectorAll('[data-act]').forEach(function(el) {
      el.style.display = 'none';
    });
    // Ẩn "Bảng tính" heading text
    document.querySelectorAll('.fs-rail-h, .fs-railcalc').forEach(function(el) {
      el.style.display = 'none';
    });
    // Ẩn tất cả SVG icon trong tab rail
    document.querySelectorAll('.fs-rail svg, .fs-rail .ti').forEach(function(el) {
      el.style.display = 'none';
    });
    // Ẩn notification bar "Nhập giả định ở các ô xanh dương..."
    document.querySelectorAll('.note, .fs-note').forEach(function(el) {
      if (el.textContent && (el.textContent.indexOf('Nhập giả định') >= 0 ||
          el.textContent.indexOf('Khi sử dụng') >= 0 ||
          el.textContent.indexOf('Điều khoản') >= 0)) {
        el.style.display = 'none';
      }
    });
    // Ẩn nút tính toán lớn ở body (chỉ giữ nút tính toán trong toolbar)
    document.querySelectorAll('.c-btn, .fs-btn.calc').forEach(function(el) {
      var parent = el.parentElement;
      if (parent && !parent.classList.contains('mac-toolbar-actions')) {
        // Giữ nút tính toán nhưng thu gọn style macOS
      }
    });
  }

  // Chạy cleanup sau 500ms và 2s (đảm bảo bắt DOM render chậm)
  setTimeout(macCleanup, 500);
  setTimeout(macCleanup, 2000);
  // Quan sát thay đổi DOM
  var appEl = document.getElementById('real-calc-app') || document.getElementById('fs-app');
  if (appEl) {
    new MutationObserver(function() {
      setTimeout(macCleanup, 100);
    }).observe(appEl, {childList: true, subtree: true});
  }
</script>
</body>
</html>
